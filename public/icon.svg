<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3139"/>
      <stop offset="1" stop-color="#0d1013"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="96"/></clipPath>
    <pattern id="hazard" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="56" height="56" fill="#14181d"/>
      <rect width="28" height="56" fill="#ff7a2f"/>
    </pattern>
    <!-- Cortes de estêncil nas letras -->
    <mask id="stencil">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="196" y="0" width="7" height="512" fill="#000"/>
      <rect x="310" y="0" width="7" height="512" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- Faixa de alerta industrial -->
    <rect y="424" width="512" height="88" fill="url(#hazard)"/>
    <rect y="416" width="512" height="10" fill="#0d1013"/>
    <!-- Desgaste: linhas de chapa metálica -->
    <path d="M0 140H512M0 300H512" stroke="#ffffff" stroke-opacity=".04" stroke-width="4"/>
  </g>

  <!-- Retícula -->
  <circle cx="256" cy="220" r="150" fill="none" stroke="#e9edf1" stroke-width="20"/>
  <g fill="#e9edf1">
    <rect x="246" y="38" width="20" height="74"/>
    <rect x="246" y="328" width="20" height="74"/>
    <rect x="74" y="210" width="74" height="20"/>
    <rect x="364" y="210" width="74" height="20"/>
  </g>
  <circle cx="256" cy="220" r="150" fill="none" stroke="#3d8bff" stroke-width="6" stroke-dasharray="10 22" opacity=".9"/>

  <!-- G3 em estêncil -->
  <g mask="url(#stencil)">
    <g fill="#ff7a2f">
      <!-- G -->
      <rect x="150" y="160" width="96" height="28"/>
      <rect x="150" y="160" width="28" height="120"/>
      <rect x="150" y="252" width="96" height="28"/>
      <rect x="218" y="214" width="28" height="66"/>
      <rect x="196" y="214" width="50" height="24"/>
      <!-- 3 -->
      <rect x="266" y="160" width="96" height="28"/>
      <rect x="284" y="208" width="78" height="24"/>
      <rect x="266" y="252" width="96" height="28"/>
      <rect x="334" y="160" width="28" height="120"/>
    </g>
  </g>
</svg>
